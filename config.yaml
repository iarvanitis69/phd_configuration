fourier_phase_min_snr: 3.0  # Ελάχιστο φασματικό SNR όταν υπάρχει αξιόπιστο φάσμα θορύβου.
fourier_phase_snr_kind: amplitude  # Είδος φασματικού SNR: amplitude για πλάτος ή power για ισχύ.
fourier_phase_absolute_amplitude_floor: 0.0  # Απόλυτο κατώφλι του |FFT_L|, στις μονάδες του φάσματος.
fourier_phase_relative_amplitude_floor: 1.0e-12  # Κατώφλι |FFT_L| ως κλάσμα του μέγιστου εντός της ζώνης φίλτρου.
fourier_phase_minimum_noise_psd: 0.0  # Κατώτερο όριο αποδεκτής φασματικής πυκνότητας ισχύος θορύβου.
fourier_phase_fnn_require_snr: false  # Απαίτηση επιβεβαιωμένου φασματικού SNR για χρήση συχνότητας στο FNN.
fourier_phase_write_unit_phasors: true  # Αποθήκευση D_phase = D/|D| για τις αποδεκτές συχνότητες.
