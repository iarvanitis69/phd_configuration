fourier_phase_min_snr: 3.0  # Minimum spectral SNR when a reliable noise spectrum is available.
fourier_phase_snr_kind: amplitude  # Spectral SNR definition: amplitude or power ratio.
fourier_phase_absolute_amplitude_floor: 0.0  # Absolute minimum |FFT_L| in the spectrum amplitude units.
fourier_phase_relative_amplitude_floor: 1.0e-12  # Minimum |FFT_L| as a fraction of the maximum inside the filter band.
fourier_phase_minimum_noise_psd: 0.0  # Lower bound for accepted noise power spectral density.
fourier_phase_fnn_require_snr: false  # Require verified spectral SNR before allowing a frequency in the FNN.
fourier_phase_write_unit_phasors: true  # Save D_phase = D/|D| for accepted frequencies.
