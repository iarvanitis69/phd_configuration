BASE_DIR: /media/iarv/Samsung/Events  # Ριζικός φάκελος σεισμών και αρχικών κυματομορφών.
LOGS_DIR: /media/iarv/Samsung/Events/Logs  # Φάκελος logs, αποτελεσμάτων και snapshots των runs.
min_magnitude_acquisition: 2.0  # Ελάχιστο μέγεθος σεισμού για λήψη δεδομένων.
max_event_depth_acquisition: 25.0  # Μέγιστο εστιακό βάθος για λήψη δεδομένων (km).
preset_on_data_acquisition: 30  # Χρόνος καταγραφής πριν από τον χρόνο γένεσης του σεισμού (s).
offset_on_data_acquisition: 240  # Χρόνος καταγραφής μετά τον χρόνο γένεσης του σεισμού (s).
cube_voxel_side_length: 1  # Μήκος πλευράς κάθε κυβικού voxel (km).
velocity_model: velocity_model_valianatos  # Όνομα του ενεργού μοντέλου ταχυτήτων από τους παρακάτω πίνακες.
velocity_model_valianatos:  # Στρωματοποιημένο μοντέλο ταχυτήτων Valianatos.
  depth_bin_edges_km:  # Όρια στρωμάτων βάθους (km)· κάθε ζεύγος ορίων ορίζει ένα στρώμα.
  - 0.0
  - 1.0
  - 3.0
  - 8.0
  - 12.0
  - 16.0
  - 18.0
  - 22.0
  - 26.0
  Vp:  # Ταχύτητα κύματος P ανά στρώμα, με τη σειρά των ορίων βάθους (km/s).
  - 4.0
  - 4.3
  - 4.8
  - 5.2
  - 5.5
  - 5.8
  - 6.1
  - 6.6
  Vp_per_Vs: 1.777  # Λόγος Vp/Vs του μοντέλου· αποθηκεύεται στα metadata.
velocity_model_papadimitriou_2015:  # Εναλλακτικό στρωματοποιημένο μοντέλο Papadimitriou 2015.
  depth_bin_edges_km:  # Όρια στρωμάτων βάθους (km)· κάθε ζεύγος ορίων ορίζει ένα στρώμα.
  - 0.0
  - 1.0
  - 3.0
  - 8.0
  - 12.0
  - 16.0
  - 18.0
  - 22.0
  - 26.0
  Vp:  # Ταχύτητα κύματος P ανά στρώμα, με τη σειρά των ορίων βάθους (km/s).
  - 4.72
  - 4.77
  - 4.97
  - 5.75
  - 5.92
  - 6.28
  - 6.48
  - 7.02
  Vp_per_Vs: 1.777  # Λόγος Vp/Vs του μοντέλου· αποθηκεύεται στα metadata.
FIX_GLITCHES_WITH_INTERPOLATION: false  # Διόρθωση glitches με παρεμβολή αντί αποκλεισμού.
must_contain_all_3_channels: false  # Απαίτηση παρουσίας και επιτυχούς QC και των τριών καναλιών.
minSnr: 3  # Όριο SNR· τιμές μικρότερες ή ίσες σημειώνονται ως χαμηλές.
minEventDuration: 3  # Ελάχιστη αποδεκτή διάρκεια κυματομορφής στο QC (s).
maxEventDuration: 240  # Μέγιστη αποδεκτή διάρκεια κυματομορφής στο QC (s).
minDepth: 0  # Ελάχιστο αποδεκτό εστιακό βάθος στο QC (km).
maxDepth: 25  # Μέγιστο αποδεκτό εστιακό βάθος στο QC (km).
low_frequency: 0.5  # Κάτω συχνότητα band-pass και φίλτρου ανίχνευσης P (Hz).
high_frequency: 30  # Άνω συχνότητα band-pass και φίλτρου ανίχνευσης P (Hz).
resampling: true  # Ενεργοποίηση προαιρετικού resampling· εκτός της τρέχουσας ροής.
resampling_rate: 70  # Συχνότητα δειγματοληψίας στόχος του resampling (Hz).
cut_pre_arrival_seconds: 0.2  # Κοινή αρχή κοπής τόσο πριν από την πρωιμότερη P των N/E/Z (s).
filter_padding_seconds: 3.0  # Ελάχιστο padding σε κάθε άκρο πριν από το band-pass (s).
p_polarization_window_seconds: 1.0  # Διάρκεια παραθύρου πόλωσης μετά τη σταθμική άφιξη P (s).
p_polarization_min_rectilinearity: 0.7  # Ελάχιστο rectilinearity για χρήση της μετρημένης πόλωσης ως L.
station_p_sta_seconds: 0.5  # Διάρκεια βραχέος παραθύρου STA για ανίχνευση P (s).
station_p_lta_seconds: 5.0  # Διάρκεια μακρού παραθύρου LTA για ανίχνευση P (s).
station_p_trigger_on: 3.0  # Λόγος STA/LTA που ενεργοποιεί έναν υποψήφιο παλμό P.
station_p_trigger_off: 1.5  # Λόγος STA/LTA που τερματίζει έναν υποψήφιο παλμό P.
station_p_aic_before_seconds: 1.0  # Περιθώριο πριν από το trigger για τοπική βελτίωση P με AIC (s).
station_p_aic_after_seconds: 0.5  # Περιθώριο μετά το trigger για τοπική βελτίωση P με AIC (s).
station_p_noise_seconds: 2.0  # Παράθυρο θορύβου για διαγνωστικό RMS SNR του picker P (s).
station_p_noise_guard_seconds: 0.1  # Κενό πριν από την P για το διαγνωστικό παράθυρο θορύβου (s).
station_p_signal_seconds: 0.5  # Παράθυρο μετά την P για διαγνωστικό RMS SNR, χωρίς αποκλεισμό (s).
station_p_min_velocity_km_s: 3.0  # Ελάχιστη φαινόμενη ταχύτητα P για το γεωμετρικό παράθυρο αναζήτησης (km/s).
station_p_max_velocity_km_s: 8.0  # Μέγιστη φαινόμενη ταχύτητα P για το γεωμετρικό παράθυρο αναζήτησης (km/s).
station_p_travel_margin_seconds: 2.0  # Επιπλέον περιθώριο στα όρια του γεωμετρικού παραθύρου P (s).
station_s_min_velocity_km_s: 1.5  # Ελάχιστη αποδεκτή φαινόμενη ταχύτητα S (km/s).
station_s_max_velocity_km_s: 4.5  # Μέγιστη αποδεκτή φαινόμενη ταχύτητα S (km/s).
station_s_min_p_travel_ratio: 1.2  # Ελάχιστος λόγος χρόνων διαδρομής tS/tP από τη γένεση.
station_s_max_p_travel_ratio: 2.5  # Μέγιστος λόγος χρόνων διαδρομής tS/tP από τη γένεση.
station_s_min_p_gap_seconds: 0.1  # Ελάχιστη χρονική απόσταση της S μετά την P (s).
station_s_travel_margin_seconds: 2.0  # Επιπλέον περιθώριο στο γεωμετρικό παράθυρο S (s).
time_normalization_scale: 1.0  # Κοινός διαιρέτης πλατών για το standalone normalize_filtered_signals.
fft_normalization_scale: 1.0  # Κοινός διαιρέτης FFT για το standalone normalize_fft_signals.
p_wave_sta_seconds: 0.5  # STA του προαιρετικού picker ανά κανάλι (s)· εκτός τρέχουσας ροής.
p_wave_lta_seconds: 5.0  # LTA του προαιρετικού picker ανά κανάλι (s)· εκτός τρέχουσας ροής.
p_wave_trigger_on: 3.0  # Όριο ενεργοποίησης του προαιρετικού picker ανά κανάλι.
p_wave_trigger_off: 1.5  # Όριο τερματισμού του προαιρετικού picker ανά κανάλι.
p_wave_search_seconds: 5.0  # Ακτίνα αναζήτησης P ανά κανάλι γύρω από τη σταθμική P στα boundaries (s).
p_wave_aic_before_seconds: 1.0  # Παράθυρο AIC πριν από το trigger του προαιρετικού picker (s).
p_wave_aic_after_seconds: 2.0  # Παράθυρο AIC μετά το trigger του προαιρετικού picker (s).
snr_noise_seconds: 30.0  # Μέγιστη διάρκεια προσεισμικού θορύβου για μέτρηση SNR (s).
snr_signal_seconds: 30.0  # Μέγιστη διάρκεια σήματος μετά την P για μέτρηση SNR (s).
snr_noise_guard_seconds: 1.0  # Κενό μεταξύ τέλους θορύβου και άφιξης P για το SNR (s).
snr_min_noise_seconds: 1.0  # Ελάχιστη απαιτούμενη διάρκεια διαθέσιμου θορύβου για SNR (s).
STF_creation_method: PGaussian  # Παλαιά επιλογή μεθόδου STF· δεν χρησιμοποιείται στην τρέχουσα ροή.
STUDY_AREA:  # Γεωγραφικά όρια, τοπικές συντεταγμένες και πλέγμα της περιοχής μελέτης.
