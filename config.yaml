BASE_DIR: /media/iarv/Samsung/Events  # Root directory for earthquake events and original waveforms.
LOGS_DIR: /media/iarv/Samsung/Events/Logs  # Directory for logs, processing outputs and run configuration snapshots.
pipeline_workers: 1  # Default concurrent jobs in heavy stages; per-stage settings/environment overrides take precedence.
tracking_backend: mongodb  # Pipeline result storage: mongodb (normal runs) or json (legacy compatibility).
mongodb_uri: mongodb://localhost:27017/?replicaSet=preprocessing  # Local MongoDB replica set; required for atomic station commits.
mongodb_database: phd_preprocessing  # Database with separate included, excluded, records and metadata collections for every preprocessing step.
mongodb_write_batch_size: 100  # Completed work units per transaction; an abrupt kill may require repeating up to 99 units (use 1 for immediate commits).
min_magnitude_acquisition: 2.0  # Minimum event magnitude for data acquisition.
max_event_depth_acquisition: 25.0  # Maximum event focal depth for data acquisition (km).
preset_on_data_acquisition: 30  # Acquisition time before the earthquake origin time (s).
offset_on_data_acquisition: 240  # Acquisition time after the earthquake origin time (s).
cube_voxel_side_length: 1  # Side length of each cubic voxel (km).
velocity_model: velocity_model_valianatos  # Name of the active velocity model defined below.
velocity_model_valianatos:  # Layered Valianatos velocity model.
  depth_bin_edges_km:  # Layer depth boundaries (km); each adjacent pair defines one layer.
  - 0.0
  - 1.0
  - 3.0
  - 8.0
  - 12.0
  - 16.0
  - 18.0
  - 22.0
  - 26.0
  Vp:  # P-wave velocity per layer, in depth-boundary order (km/s).
  - 4.0
  - 4.3
  - 4.8
  - 5.2
  - 5.5
  - 5.8
  - 6.1
  - 6.6
  Vp_per_Vs: 1.777  # Model Vp/Vs ratio; recorded in metadata.
velocity_model_papadimitriou_2015:  # Alternative layered Papadimitriou 2015 velocity model.
  depth_bin_edges_km:  # Layer depth boundaries (km); each adjacent pair defines one layer.
  - 0.0
  - 1.0
  - 3.0
  - 8.0
  - 12.0
  - 16.0
  - 18.0
  - 22.0
  - 26.0
  Vp:  # P-wave velocity per layer, in depth-boundary order (km/s).
  - 4.72
  - 4.77
  - 4.97
  - 5.75
  - 5.92
  - 6.28
  - 6.48
  - 7.02
  Vp_per_Vs: 1.777  # Model Vp/Vs ratio; recorded in metadata.
FIX_GLITCHES_WITH_INTERPOLATION: false  # Repair glitches by interpolation instead of rejecting affected data.
must_contain_all_3_channels: false  # Require all three channels to be present and pass quality control.
minSnr: 3  # Full-LQT SNR threshold; reject the station only when measured SNR_L <= this value (Q/T diagnostic).
minEventDuration: 3  # Minimum boundary-defined event duration in the full LQT trace during QC (s).
maxEventDuration: 240  # Maximum boundary-defined event duration in the full LQT trace during QC (s).
minDepth: 0  # Minimum accepted event focal depth during QC (km).
maxDepth: 25  # Maximum accepted event focal depth during QC (km).
low_frequency: 0.5  # Lower band-pass frequency for filtering and P detection (Hz).
high_frequency: 30  # Upper band-pass frequency for filtering and P detection (Hz).
cut_pre_arrival_seconds: 0.2  # Common cut start offset before the earliest N/E/Z P arrival (s).
cut_estimated_s_margin_seconds: 0  # Safety margin before an S arrival estimated from P travel time (s).
cut_minimum_duration_reference_seconds: 0.5  # Minimum cut duration = pre-arrival + this reference - estimated-S margin (s).
filter_padding_seconds: 3.0  # Minimum padding at each signal edge before band-pass filtering (s).
p_polarization_window_seconds: 1.0  # Polarization window duration after the station P arrival (s).
p_polarization_min_rectilinearity: 0.7  # Minimum rectilinearity for using measured polarization as the L axis.
station_p_sta_seconds: 0.5  # Short-term averaging window for P detection (s).
station_p_lta_seconds: 5.0  # Long-term averaging window for P detection (s).
station_p_trigger_on: 3.0  # STA/LTA ratio that starts a candidate P trigger.
station_p_trigger_off: 1.5  # STA/LTA ratio that ends a candidate P trigger.
station_p_aic_before_seconds: 1.0  # Time before the trigger for local AIC refinement of P (s).
station_p_aic_after_seconds: 0.5  # Time after the trigger for local AIC refinement of P (s).
station_p_noise_seconds: 2.0  # Noise window for diagnostic RMS SNR in the P picker (s).
station_p_noise_guard_seconds: 0.1  # Gap before P for the diagnostic noise window (s).
station_p_signal_seconds: 0.5  # Post-P window for diagnostic RMS SNR; does not reject stations (s).
station_p_min_velocity_km_s: 3.0  # Minimum apparent P velocity for the geometric search window (km/s).
station_p_max_velocity_km_s: 8.0  # Maximum apparent P velocity for the geometric search window (km/s).
station_p_travel_margin_seconds: 2.0  # Extra margin at both bounds of the geometric P search window (s).
station_s_min_velocity_km_s: 1.5  # Minimum accepted apparent S velocity (km/s).
station_s_max_velocity_km_s: 4.5  # Maximum accepted apparent S velocity (km/s).
station_s_min_p_travel_ratio: 1.2  # Minimum travel-time ratio tS/tP measured from the event origin.
station_s_max_p_travel_ratio: 2.5  # Maximum travel-time ratio tS/tP measured from the event origin.
station_s_min_p_gap_seconds: 0.1  # Minimum time separation between S and P arrivals (s).
station_s_travel_margin_seconds: 2.0  # Extra margin for the geometric S search window (s).
boundaries_workers: 1  # Concurrent stations in boundaries; 1 limits peak waveform RAM use.
p_wave_search_seconds: 5.0  # Per-channel P search radius around station P in boundaries (s).
snr_noise_seconds: 30.0  # Maximum pre-P noise-window duration for SNR measurement (s).
snr_signal_seconds: 30.0  # Maximum post-P signal-window duration for SNR measurement (s).
snr_noise_guard_seconds: 1.0  # Gap between the noise-window end and P arrival for SNR (s).
snr_min_noise_seconds: 1.0  # Minimum available noise duration required for SNR measurement (s).
